name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Supabase RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase and apply migrations
        run: pnpm exec supabase start
      - name: Run pgTAP database tests
        run: pnpm exec supabase test db
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
